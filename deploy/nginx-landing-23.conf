server {
    listen 8433;
    listen [::]:8433;
    server_name _;

    root /srv/zmo_landing_23;
    index index.html;
    client_max_body_size 8k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/feedback.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/feedback.php;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
